<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kópir — взаимный AI-подбор знакомств для IT-мероприятий" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b93b3" />
    <title>Kópir</title>
    <script>
      // Тема до первой отрисовки, чтобы страница не мигала другой темой.
      try {
        var theme = JSON.parse(localStorage.getItem("kopir.theme") || '"system"');
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
