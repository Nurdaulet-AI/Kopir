[project]
name = "kopir"
version = "0.1.0"
description = "Kópir: взаимный AI-подбор знакомств для IT-мероприятий"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
